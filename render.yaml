# Deploy gratuito no Render (Hobby / Free instance types)
# Dashboard: https://dashboard.render.com/select-repo?type=blueprint
# Docs: https://render.com/docs/free

databases:
  - name: devtech-db
    plan: free
    databaseName: devpath
    user: devpath
    postgresMajorVersion: '16'

services:
  # Nome único: "devtech-api.onrender.com" já pertence a outro projeto
  - type: web
    name: devpath-alysonlucn-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: DATABASE_URL
        fromDatabase:
          name: devtech-db
          property: connectionString
      - key: DB_SSL
        value: 'false'
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: ASSESSMENT_PASS_SCORE
        value: '70'
      - key: LLM_PROVIDER
        value: mock
      - key: SEED_DATABASE
        value: 'true'
      - key: LOG_LEVEL
        value: info

  # Web service (não static site): o publish estático no Render estava
  # servindo o HTML sem os assets (/assets/*.js → 404 → tela branca).
  - type: web
    name: devpath-alysonlucn-web
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: VITE_API_URL
        value: https://devpath-alysonlucn-api.onrender.com/api/v1
